<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Project 1</title>
    <style>
        :root {
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --accent-red: #ef4444;
            --bg-dark: #09090b;
            --card-black: #121215;
            --card-border: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --success: #16a34a;
            --blue-badge: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background-color: var(--card-black);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        h1, h2 {
            text-align: center;
            color: var(--text-main);
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-dark);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: var(--primary-red-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: var(--accent-red);
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }

        /* DASHBOARD STYLES */
        #dashboardApp {
            display: none;
            width: 100%;
            max-width: 1100px;
            padding: 30px 20px;
            min-height: 100vh;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-black);
            padding: 24px 28px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h2 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .red-dot {
            width: 10px;
            height: 10px;
            background-color: var(--primary-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-red);
        }

        .logout-btn {
            background-color: transparent;
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: auto;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--accent-red);
        }

        /* STATS CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: var(--card-black);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
        }

        .stat-card.highlight {
            border-left: 4px solid var(--primary-red);
        }

        /* CONTROLS BAR */
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 260px;
            max-width: 380px;
        }

        .search-box input {
            padding-left: 38px;
            background-color: var(--card-black);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .add-btn {
            width: auto;
            background-color: var(--primary-red);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background-color: var(--primary-red-hover);
        }

        /* TABLE STYLES */
        .table-container {
            background-color: var(--card-black);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--card-border);
        }

        td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* BADGES & BUTTONS */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-bsit {
            background-color: rgba(220, 38, 38, 0.15);
            color: #f87171;
            border: 1px solid rgba(220, 38, 38, 0.3);
        }

        .badge-other {
            background-color: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(37, 99, 235, 0.3);
        }

        .action-btns button {
            width: auto;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            margin-right: 6px;
            transition: opacity 0.2s;
        }

        .action-btns button:hover {
            opacity: 0.85;
        }

        .btn-edit { background-color: #27272a; color: var(--text-main); border: 1px solid var(--card-border) !important; }
        .btn-delete { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-black);
            padding: 32px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="container">
        <div class="card">
            <div class="login-header">
                <h1>System Login</h1>
                <p>Student Management System</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" autocomplete="off" required>
                </div>
                <button type="submit" class="btn-primary">Log In</button>
                <div id="loginError" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboardApp">
        <div class="header">
            <div class="header-title">
                <div class="red-dot"></div>
                <h2>Student Management Dashboard</h2>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Log Out</button>
        </div>

        <!-- STATS CARDS SUMMARY -->
        <div class="stats-grid">
            <div class="stat-card highlight">
                <span class="stat-label">Total Records</span>
                <span class="stat-value" id="statTotal">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">BSIT Enrollees</span>
                <span class="stat-value" id="statBsit">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Other Programs</span>
                <span class="stat-value" id="statOther">0</span>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search student name or ID..." onkeyup="filterStudents()">
            </div>
            <button class="add-btn" onclick="openModal()">+ Add Student</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Full Name</th>
                        <th>Course</th>
                        <th>Year Level</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ADD/EDIT MODAL -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 20px; text-align: left;">Add Student</h2>
            <form id="studentForm" onsubmit="saveStudent(event)">
                <input type="hidden" id="editIndex">
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="studId" required>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="studName" required>
                </div>
                <div class="form-group">
                    <label>Course</label>
                    <select id="studCourse" required>
                        <option value="BSIT">BSIT</option>
                        <option value="BSCS">BSCS</option>
                        <option value="BSIS">BSIS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Year Level</label>
                    <select id="studYear" required>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" class="btn-primary">Save Record</button>
                    <button type="button" class="btn-primary" style="background-color: #27272a; color: var(--text-main);" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let students = JSON.parse(localStorage.getItem('sms_students')) || [
            { id: '2021007', name: 'Majorie Buendia', course: 'BSIT', year: '4th Year' },
            { id: '210000', name: 'Bianca Nicole Sore', course: 'BSIT', year: '4th Year' }
        ];

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === 'admin' && pass === 'admin123') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardApp').style.display = 'flex';
                renderTable();
            } else {
                document.getElementById('loginError').innerText = 'Invalid username or password!';
            }
        }

        function handleLogout() {
            document.getElementById('dashboardApp').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('loginForm').reset();
            document.getElementById('loginError').innerText = '';
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = students.length;
            const bsitCount = students.filter(s => s.course === 'BSIT').length;
            document.getElementById('statBsit').innerText = bsitCount;
            document.getElementById('statOther').innerText = students.length - bsitCount;
        }

        function renderTable(data = students) {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#a1a1aa; padding: 30px;">No student records found.</td></tr>`;
                updateStats();
                return;
            }

            data.forEach((stud, index) => {
                const badgeClass = stud.course === 'BSIT' ? 'badge-bsit' : 'badge-other';
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: 600;">${stud.id}</td>
                        <td>${stud.name}</td>
                        <td><span class="badge ${badgeClass}">${stud.course}</span></td>
                        <td>${stud.year}</td>
                        <td class="action-btns">
                            <button class="btn-edit" onclick="editStudent(${index})">Edit</button>
                            <button class="btn-delete" onclick="deleteStudent(${index})">Delete</button>
                        </td>
                    </tr>
                `;
            });
            updateStats();
        }

        function openModal(isEdit = false) {
            document.getElementById('studentModal').style.display = 'flex';
            document.getElementById('modalTitle').innerText = isEdit ? 'Edit Student' : 'Add Student';
        }

        function closeModal() {
            document.getElementById('studentModal').style.display = 'none';
            document.getElementById('studentForm').reset();
            document.getElementById('editIndex').value = '';
        }

        function saveStudent(e) {
            e.preventDefault();
            const id = document.getElementById('studId').value;
            const name = document.getElementById('studName').value;
            const course = document.getElementById('studCourse').value;
            const year = document.getElementById('studYear').value;
            const editIndex = document.getElementById('editIndex').value;

            if (editIndex === '') {
                students.push({ id, name, course, year });
            } else {
                students[editIndex] = { id, name, course, year };
            }

            localStorage.setItem('sms_students', JSON.stringify(students));
            renderTable();
            closeModal();
        }

        function editStudent(index) {
            const stud = students[index];
            document.getElementById('studId').value = stud.id;
            document.getElementById('studName').value = stud.name;
            document.getElementById('studCourse').value = stud.course;
            document.getElementById('studYear').value = stud.year;
            document.getElementById('editIndex').value = index;
            openModal(true);
        }

        function deleteStudent(index) {
            if (confirm('Are you sure you want to delete this record?')) {
                students.splice(index, 1);
                localStorage.setItem('sms_students', JSON.stringify(students));
                renderTable();
            }
        }

        function filterStudents() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = students.filter(s => 
                s.name.toLowerCase().includes(query) || s.id.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }
    </script>
</body>
</html>
